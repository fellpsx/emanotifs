name: EMA alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: ema-alerts

jobs:
  run:
    if: ${{ vars.ALERTS_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python ema_alerts.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          COINS: ${{ vars.COINS }}
          TIMEFRAMES: ${{ vars.TIMEFRAMES }}
          EMA_PERIODS: ${{ vars.EMA_PERIODS }}
      - name: Save state
        run: |
          git config user.name "ema-bot"
          git config user.email "ema-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update state" && git push)
